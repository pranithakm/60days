<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My 60-Day Transformation</title>
  <meta name="description" content="Personal 60-day diet, routine, exercise and progress tracker.">
  <meta name="theme-color" content="#f7e4ea">
  <meta name="color-scheme" content="light">

  <!-- PWA / iPhone Home Screen -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My 60 Days">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ===== Header ===== -->
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-kicker">My 60-Day</span>
          <h1 class="brand-title">Transformation</h1>
        </div>
        <div class="topbar-actions">
          <button class="sync-pill" id="syncPill" type="button" aria-live="polite" title="Sync status">
            <span class="dot"></span><span class="sync-text">Local</span>
          </button>
          <button class="icon-btn" id="openSettings" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          </button>
        </div>
      </div>

      <div class="date-nav">
        <button class="icon-btn small" id="prevDay" type="button" aria-label="Previous day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <label class="date-label">
          <span id="dateText">Today</span>
          <input type="date" id="datePicker" aria-label="Choose date">
        </label>
        <button class="icon-btn small" id="nextDay" type="button" aria-label="Next day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="chip-btn" id="goToday" type="button">Today</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <!-- ===== Dashboard summary ===== -->
    <section class="summary card" id="summary" aria-label="Today's summary"></section>

    <!-- ===== Four main sections ===== -->
    <main class="sections" id="sections">
      <section class="view" id="view-routine" data-view="routine" aria-label="Routine checklist"></section>
      <section class="view" id="view-food" data-view="food" aria-label="Food and nutrition"></section>
      <section class="view" id="view-exercise" data-view="exercise" aria-label="Exercise and activity"></section>
      <section class="view" id="view-progress" data-view="progress" aria-label="Progress and streaks"></section>
    </main>
  </div>

  <!-- ===== Bottom navigation ===== -->
  <nav class="bottom-nav" aria-label="Sections">
    <button type="button" class="nav-btn" data-tab="routine">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
      <span>Routine</span>
    </button>
    <button type="button" class="nav-btn" data-tab="food">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>
      <span>Food</span>
    </button>
    <button type="button" class="nav-btn" data-tab="exercise">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="m7 21 3-6 3 2v5M10 15l1.5-5L15 12l3 1M8.5 10.5 11.5 10"/></svg>
      <span>Exercise</span>
    </button>
    <button type="button" class="nav-btn" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
      <span>Progress</span>
    </button>
  </nav>

  <!-- ===== Modal / bottom sheet ===== -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- ===== Settings (full screen) ===== -->
  <div class="settings-page" id="settingsPage" hidden>
    <header class="settings-head">
      <button class="icon-btn" id="closeSettings" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h2>Settings</h2>
      <span class="spacer"></span>
    </header>
    <div class="settings-body" id="settingsBody"></div>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">Please enable JavaScript to use this tracker.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
